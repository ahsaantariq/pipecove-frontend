<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Newsreader";
    src: url("file:///workspace/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Outfit";
    src: url("file:///workspace/node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2") format("woff2");
    font-weight: 300 700;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #F4F1EA;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid #E3DDD2;
    border-radius: 28px;
    pointer-events: none;
  }
  .lockup {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 860px;
  }
  h1 {
    margin: 32px 0 0;
    padding: 0;
    font-family: "Newsreader", "Iowan Old Style", Palatino, serif;
    font-weight: 520;
    font-size: 168px;
    line-height: 0.92;
    letter-spacing: -0.035em;
    color: #10211D;
  }
  p {
    margin: 20px 0 0;
    padding: 0;
    font-family: "Outfit", ui-sans-serif, sans-serif;
    font-weight: 450;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: 0.01em;
    color: #0F6E64;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="lockup">
    <svg width="136" height="136" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#10211D"/>
      <path
        d="M7.2 11.2h8.4c4.7 0 8.2 3.3 8.2 7.6 0 3.6-2.6 6.2-6.4 6.2H13"
        fill="none"
        stroke="#2DD4BF"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <h1>Pipecove</h1>
    <p>One cove for every conversation.</p>
  </div>
</body>
</html>
